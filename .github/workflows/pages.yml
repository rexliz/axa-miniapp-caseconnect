name: Test und Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Deployments werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # Das Projekt hat keine npm-Abhängigkeiten und keine Lock-Datei.
          package-manager-cache: false
      - run: npm test

  deploy:
    name: Deploy src/ auf GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v5
